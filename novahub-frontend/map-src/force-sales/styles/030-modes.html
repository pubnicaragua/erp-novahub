<style>
/* Modos del mapa: cada bloque marcado con data-mode-only se muestra solo en los modos listados. */
[data-mode-hidden],body:not([data-mode]) [data-mode-only]{display:none!important}
.engine-controls{display:none!important}
.mode-block{display:grid;gap:8px;margin:0 0 10px}
.mode-block .search-meta{margin:0}
.mode-block .search-tools{margin:0}
.zone-section>summary{display:flex;align-items:center;justify-content:space-between;min-height:30px;cursor:pointer;list-style:none;font-weight:800}
.zone-section>summary::-webkit-details-marker{display:none}
.zone-section>summary:after{content:'⌄';margin-left:auto;color:var(--nova-ui-muted-foreground,#6c7c77)}
.zone-section[open]>summary:after{transform:rotate(180deg)}
.zone-heading-actions{display:flex;justify-content:flex-end;margin:0 0 4px}
.zone-heading-actions button{border:0;background:transparent;color:var(--nova-ui-primary,#08785a);font-size:11px;font-weight:700;cursor:pointer;padding:2px 0}
.work-zones-head{display:flex;align-items:center;justify-content:space-between;gap:8px}
.work-zones-head b{font-size:12px}
.work-zones-head button{border:0;background:transparent;color:var(--nova-ui-primary,#08785a);font-size:11px;font-weight:800;cursor:pointer;padding:4px 2px}
.work-zone-list{display:grid;gap:6px}
.work-zone-item{display:grid;grid-template-columns:10px minmax(0,1fr);gap:4px 8px;align-items:center;padding:7px 8px;border:1px solid var(--nova-ui-border,#dce8e3);border-radius:10px;background:var(--nova-ui-card,#fff);cursor:pointer}
.work-zone-item.active{border-color:var(--nova-ui-primary,#08785a)}
.work-zone-swatch{width:10px;height:10px;border-radius:50%}
.work-zone-copy{display:grid;min-width:0}
.work-zone-copy b{font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.work-zone-copy small{font-size:10px;color:var(--nova-ui-muted-foreground,#6c7c77)}
.work-zone-actions{grid-column:2;display:flex;flex-wrap:wrap;gap:4px}
.work-zone-actions button{min-height:28px;padding:3px 9px;border:1px solid var(--nova-ui-border,#dce8e3);border-radius:8px;background:transparent;color:inherit;font-size:10px;font-weight:700;cursor:pointer}
#map.drawing-zone{cursor:crosshair}
.customer-debt .debt-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:0 0 6px}
.debt-cell{display:grid;gap:1px;padding:6px 8px;border-radius:9px;background:var(--nova-ui-muted,#edf5f1)}
.debt-cell span{font-size:9px;color:var(--nova-ui-muted-foreground,#6c7c77)}
.debt-cell b{font-size:12px}
.debt-overdue,.debt-overdue b{color:#b42318}
.visit-history .visit-row{display:grid;gap:1px;padding:5px 0;border-bottom:1px solid var(--nova-ui-border,#dce8e3);font-size:11px}
.visit-history .visit-row small{color:var(--nova-ui-muted-foreground,#6c7c77)}
.visit-outcome{min-height:34px;border:1px solid var(--nova-ui-border,#dce8e3);border-radius:8px;background:var(--nova-ui-card,#fff);color:inherit;font-size:11px}

/* Control de zoom debajo de los botones flotantes (antes quedaba tapado por «Nuevo punto»). */
.leaflet-top.leaflet-left{top:58px}
@media(max-width:820px){.leaflet-top.leaflet-left{top:70px}}
/* Estado de conexión: se lee completo y solo muestra el detalle cuando hay un problema. */
body.embedded-view .panel-status{flex-wrap:wrap;row-gap:2px}
body.embedded-view .panel-status #liveStatus,body.embedded-view .panel-status #offlineStatusText{white-space:normal;overflow:visible;text-overflow:clip;flex:1 1 100%;font-size:11px;line-height:1.35}
.panel-status[data-ok="true"] #offlineStatusText,.panel-status[data-ok="true"] .panel-status-separator{display:none}
/* Visitas: filtros, tarjetas de cliente y estado vacío. */
.visit-chips{display:flex;gap:6px}
.visit-chips .chip{flex:1;min-height:34px;font-size:12px}
.visit-item .itemtop{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.visit-item .itemname{font-size:14px;font-weight:800}
.visit-item .meta{font-size:12px;margin-top:2px}
.visit-pill{flex:none;padding:3px 9px;border-radius:999px;font-size:11px;font-weight:800;white-space:nowrap}
.visit-pill.pending{background:#fff4d6;color:#7a5200}
.visit-pill.done{background:#dcf5e8;color:#075c3a}
.visit-item .item-actions{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.visit-item .item-actions button{min-height:36px;font-size:12px}
.visit-item .item-actions .visit-action{flex:1 1 100%;background:var(--nova-ui-primary,#08785a);color:#fff;border-color:transparent;font-weight:800}
.visit-item .item-actions button:not(.visit-action){flex:1}
.empty-list{display:grid;gap:4px;padding:16px 12px;border:1px dashed var(--nova-ui-border,#dce8e3);border-radius:12px;text-align:center;font-size:12px;color:var(--nova-ui-muted-foreground,#6c7c77)}
.empty-list b{font-size:13px;color:inherit;color:var(--nova-ui-foreground,#11241f)}
/* Entregas: guía de tres pasos. */
.delivery-guide{padding:12px;border:1px solid var(--nova-ui-border,#dce8e3);border-radius:12px;background:var(--nova-ui-card,#fff)}
.delivery-guide b{font-size:13px}
.delivery-guide ol{margin:0;padding-left:18px;display:grid;gap:4px;font-size:12px;line-height:1.4}
.delivery-new-route{min-height:40px;border:0;border-radius:10px;background:var(--nova-ui-primary,#08785a);color:#fff;font-weight:800;font-size:13px;cursor:pointer}
.visit-item .itemtop:has(.check){justify-content:flex-start;align-items:center;gap:10px}
.visit-item .itemtop:has(.check) .itemname{text-align:left}
body.embedded-view .panel-status #liveStatus{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.mode-block .search-meta{display:none}
/* Panel del mapa embebido: sin título repetido, acciones compactas y zonas fáciles de marcar. */
body.embedded-view #sheetHeader h1{display:none}
body.embedded-view[data-mode="visits"] .panel-status[data-ok="true"],body.embedded-view[data-mode="delivery"] .panel-status[data-ok="true"]{display:none}
body.embedded-view #offlineStatusText{cursor:pointer}
@media(min-width:821px){body.embedded-view .fabbar #newPoint{display:none}}
body.embedded-view .action-cards{grid-template-columns:1fr 1fr}
body.embedded-view .action-card{min-height:44px}
body.embedded-view .action-card-copy small,body.embedded-view .action-card-chevron{display:none}
body.embedded-view .action-card-copy b{font-size:12px}
.zone-mark-button{min-height:44px;width:100%;border:0;border-radius:12px;background:var(--nova-ui-primary,#08785a);color:#fff;font-size:14px;font-weight:800;cursor:pointer}
.zone-mark-button[hidden]{display:none}
.zone-hint{position:fixed;z-index:950;top:14px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:10px;padding:10px 14px;border-radius:14px;background:#08785a;color:#fff;font-size:14px;font-weight:700;box-shadow:0 8px 24px rgba(0,0,0,.25)}
.zone-hint[hidden]{display:none}
.zone-hint button{min-height:32px;padding:4px 12px;border:1px solid rgba(255,255,255,.7);border-radius:9px;background:transparent;color:#fff;font-weight:700;cursor:pointer}
#workZoneModal{background:transparent!important;pointer-events:none;align-items:flex-end!important;justify-content:flex-start!important}
#workZoneModal .confirm-modal{pointer-events:auto;box-shadow:0 12px 40px rgba(0,0,0,.28);width:min(380px,calc(100% - 24px))}
.radius-chips{display:flex;flex-wrap:wrap;gap:6px}
.radius-chips button{flex:1;min-height:38px;border:1px solid var(--nova-ui-border,#dce8e3);border-radius:10px;background:var(--nova-ui-card,#fff);color:inherit;font-weight:700;cursor:pointer}
.radius-chips button.active{background:var(--nova-ui-primary,#08785a);border-color:transparent;color:#fff}
#workZoneModal{-webkit-backdrop-filter:none!important;backdrop-filter:none!important}
.radius-chips button{flex:1 1 0;min-width:0;white-space:nowrap;padding:0 2px;font-size:11px}
/* Mismo estilo que el ERP: Montserrat, pesos medios y botones de tamaño normal para que el panel no se vea cargado. */
.visit-item .itemname{font-size:13px;font-weight:600}
.visit-item .meta{font-size:12px;font-weight:400}
.visit-pill{font-size:10px;font-weight:600}
.visit-item .item-actions{flex-wrap:nowrap;gap:6px;margin-top:8px}
.visit-item .item-actions button{min-height:32px;padding:4px 8px;font-size:11px;font-weight:600;border-radius:8px}
.visit-item .item-actions .visit-action{flex:1 1 auto}
.visit-item .item-actions button:not(.visit-action){flex:0 0 auto}
.zone-mark-button{min-height:40px;font-size:13px;font-weight:600;border-radius:10px}
.delivery-new-route{min-height:36px;font-size:13px;font-weight:600}
.delivery-guide b{font-weight:600}
.empty-list b{font-weight:600}
.zone-hint{font-weight:600}
.radius-chips button{font-weight:600}
</style>
