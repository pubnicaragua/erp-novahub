<!doctype html>
<html lang="es">
  <head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"></head>
  <body>
    <main class="invoice-layout">
      <header class="invoice-brand">{{slot:company}}</header>
      <section class="invoice-heading">{{slot:document}}</section>
      <section class="invoice-party">{{slot:counterparty}}</section>
      <section class="invoice-detail">{{slot:items}}</section>
      <section class="invoice-summary">{{slot:totals}}</section>
      <footer class="invoice-notes">{{slot:footer}}</footer>
    </main>
  </body>
</html>
